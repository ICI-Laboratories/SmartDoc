# api_gateway/Cargo.toml
[package]
name = "api_gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"

# Runtime async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }

# HTTP client (necesitamos "stream" para bytes_stream)
reqwest = { version = "0.11", features = ["json", "stream", "gzip", "brotli", "deflate"] }

# SQLite + wrapper async
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-rusqlite = "0.5"

# Concurrencia
dashmap = "5.5"

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observabilidad
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Middleware HTTP útil (trace + compresión)
tower-http = { version = "0.5", features = ["trace", "compression-br", "compression-gzip", "compression-deflate"] }

# Tipos HTTP (lo usa el builder en el proxy)
http = "1"

# Errores
anyhow = "1"
