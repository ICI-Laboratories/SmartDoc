# api_gateway/Cargo.toml

[package]
name = "api_gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
# El framework web moderno y asíncrono
axum = "0.6"

# El runtime asíncrono estándar de Rust
tokio = { version = "1", features = ["full"] }

# Para serializar/deserializar JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Un cliente HTTP asíncrono y robusto para llamar a otros servicios
reqwest = { version = "0.11", features = ["json"] }

# El driver para SQLite, seguro y concurrente
rusqlite = { version = "0.29", features = ["bundled"] }

# Un HashMap concurrente y ultra-rápido para las métricas de usuarios
dashmap = "5.5"

# Para manejar fechas y horas
chrono = { version = "0.4", features = ["serde"] }

# Para manejar errores de forma elegante
anyhow = "1.0"