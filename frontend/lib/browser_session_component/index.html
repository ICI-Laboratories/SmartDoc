<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SmartDoc central session</title>
  </head>
  <body>
    <div id="status" role="status"></div>
    <script>
      function postMessage(type, payload) {
        const message = Object.assign({ isStreamlitMessage: true, type: type }, payload || {});
        window.parent.postMessage(message, "*");
      }

      function setValue(value) {
        postMessage("streamlit:setComponentValue", { value: value, dataType: "json" });
      }

      function setHeight(height) {
        postMessage("streamlit:setFrameHeight", { height: height });
      }

      let requestStarted = false;
      async function onRender(event) {
        const data = event && event.data ? event.data : {};
        if (data.type !== "streamlit:render" || requestStarted) {
          return;
        }
        const args = data.args || {};
        if (args.action !== "logout") {
          setHeight(0);
          return;
        }

        requestStarted = true;
        document.getElementById("status").textContent = "Cerrando sesion...";
        setHeight(28);
        try {
          const response = await fetch(args.gateway_url.replace(/\/$/, "") + "/auth/logout", {
            method: "POST",
            credentials: "include",
            headers: { "X-CSRF-Token": args.csrf_token },
            cache: "no-store"
          });
          if (!response.ok && response.status !== 204) {
            throw new Error("logout rejected");
          }
          setValue({ status: "ok" });
          window.top.location.replace(args.frontend_url);
        } catch (_error) {
          document.getElementById("status").textContent = "No se pudo cerrar la sesion.";
          setValue({ status: "error" });
        }
      }

      window.addEventListener("message", onRender);
      postMessage("streamlit:componentReady", { apiVersion: 1 });
    </script>
  </body>
</html>
