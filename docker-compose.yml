services:
  api_gateway:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SARA_ANONYMOUS: "false"
      SMARTDOC_GATEWAY_LISTEN: 0.0.0.0:8080
      SMARTDOC_AUTH_PORTAL_URL: http://localhost:3000
      SMARTDOC_IDENTITY_URL: http://host.docker.internal:8001
      SMARTDOC_AUTH_CALLBACK_URL: http://localhost:8080/auth/callback
      SMARTDOC_FRONTEND_URL: http://localhost:8501/
      SMARTDOC_COOKIE_SECURE: "false"
      SMARTREVIEW_DOC_PROCESSOR_URL: http://document_processor:8002
      SMARTREVIEW_LLM_SERVICE_URL: http://llm_service:8001
      SMARTREVIEW_GATEWAY_TIMEOUT: ${SMARTREVIEW_GATEWAY_TIMEOUT:-900}
      SMARTREVIEW_MAX_BODY_BYTES: ${SMARTREVIEW_MAX_BODY_BYTES:-104857600}
    volumes:
      - ./smartdoc_data:/app/data
    networks:
      - smartdoc_network
    depends_on:
      - document_processor
      - llm_service
    extra_hosts:
      - "host.docker.internal:host-gateway"

  document_processor:
    build:
      context: .
      dockerfile: document_processor/Dockerfile
    environment:
      SMARTREVIEW_BASE: /app/data
      SMARTREVIEW_LLM_SERVICE_URL: http://llm_service:8001
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-http://llm-gateway:8000/v1}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-}
      SARA_EMBEDDING_MODEL: ${SARA_EMBEDDING_MODEL:-}
      SARA_EMBEDDING_REVISION: ${SARA_EMBEDDING_REVISION:-llama.cpp-v1}
      SARA_EMBEDDING_QUERY_INSTRUCTION: ${SARA_EMBEDDING_QUERY_INSTRUCTION:-}
      SARA_OCR_MODEL: ${SARA_OCR_MODEL:-}
      SARA_OCR_PROFILE: ${SARA_OCR_PROFILE:-glm-ocr}
      SARA_OCR_MAX_SIDE: ${SARA_OCR_MAX_SIDE:-1600}
    volumes:
      - ./smartdoc_data:/app/data
    networks:
      - smartdoc_network
      - llm-apps

  llm_service:
    build:
      context: .
      dockerfile: llm_service/Dockerfile
    environment:
      - LLM_GATEWAY_BASE_URL=${LLM_GATEWAY_BASE_URL:-http://llm-gateway:8000/v1}
      - LLM_GATEWAY_API_KEY=${LLM_GATEWAY_API_KEY:-}
      - SARA_EMBEDDING_MODEL=${SARA_EMBEDDING_MODEL:-}
      - SARA_EMBEDDING_REVISION=${SARA_EMBEDDING_REVISION:-llama.cpp-v1}
      - SARA_EMBEDDING_QUERY_INSTRUCTION=${SARA_EMBEDDING_QUERY_INSTRUCTION:-}
      - SMARTREVIEW_MODEL=${SMARTREVIEW_MODEL:-sara-main}
      - SMARTREVIEW_LM_TIMEOUT=${SMARTREVIEW_LM_TIMEOUT:-300}
      - SMARTREVIEW_BASE=/app/data
    volumes:
      - ./smartdoc_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smartdoc_network
      - llm-apps

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      SMARTREVIEW_API_GATEWAY_URL: http://api_gateway:8080
      SMARTDOC_PUBLIC_GATEWAY_URL: http://localhost:8080
      SMARTDOC_FRONTEND_URL: http://localhost:8501/
      SMARTREVIEW_BASE: /app/data
    volumes:
      - ./smartdoc_data:/app/data
    networks:
      - smartdoc_network
    depends_on:
      - api_gateway

networks:
  llm-apps:
    name: llm-apps
    external: true
  smartdoc_network:
    driver: bridge
